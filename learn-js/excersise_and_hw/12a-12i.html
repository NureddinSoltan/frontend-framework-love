    // Another way
    let message = 2
    let intervalID
    function titleMessage() {
      intervalID = setInterval(function () {
        if (document.title === 'Document') {

        } else {

      }, 1000);

    function addMessage() {
      message++

      }
    }

      if (message > 0) {
        message--;

        // document.title = 'App'
        stopNotification()
      }
    }

    function stopNotification() {
      clearInterval(intervalID)
      intervalID = false
