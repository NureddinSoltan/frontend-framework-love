<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>
<link rel="stylesheet" href="styles/12-rock-paper-scissors.css">

<body>
  <p class="title">Rock Paper Scissors</p>
  <div>
    <!--         1/3      2/3        -->
    <!-- 0 _______|________|_______1 -->
    <!--     rock    paper  scissors -->

    <button class="move-button js-rock-button"><img src="imgs/rock-emoji.png" class="move-icon"></button>

    <button class="move-button js-paper-button"><img src="imgs/paper-emoji.png" class="move-icon"></button>

    <button class="move-button js-scissors-button"><img src="imgs/scissors-emoji.png" class="move-icon"></button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score')
    updateScoreElement()
    " class="reset-score-button">Reset Score</button>

    <button class="auto-play-button" onclick="
    autoPlay();
    ">Auto play</button>
  </div>

  <script src="scripts/12-rock-paper-scissors.js"></script>
</body>

</html>
